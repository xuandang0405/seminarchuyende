services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}) }'"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["127.0.0.1:8000:8000"]
    environment: &app-environment
      APP_ENV: development
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      DATABASE_NAME: tourvoice_dev
      ALLOW_MOCK_DATABASE: "false"
      PAYMENT_MODE: mock
      PUBLIC_WEB_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8000
      COOKIE_SECURE: "false"
      MEDIA_STORAGE_DIR: /app/backend/storage
      SUPERADMIN_BOOTSTRAP_MODE: ${SUPERADMIN_BOOTSTRAP_MODE:-disabled}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@tourvoice.vn}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    volumes: ["media_data:/app/backend/storage"]
    depends_on:
      mongodb: { condition: service_healthy }
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *app-environment
    command: ["python", "worker.py"]
    volumes: ["media_data:/app/backend/storage"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck: { disable: true }
volumes:
  mongo_data:
  media_data:
