# ==============================================================================
# Nginx Reverse Proxy Configuration for TourVoice (Quận 4)
# Path on host: /etc/nginx/sites-available/tour-guide.conf
# Symlink: ln -sf /etc/nginx/sites-available/tour-guide.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream Backend FastAPI (Uvicorn)
upstream fastapi_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80)
# In IP testing phase: Serves requests directly with same-origin proxy.
# In Production domain phase: Automatically redirects to HTTPS 443.
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 1.55.58.251 tour.quan4.vn localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size for audio uploads
    client_max_body_size 50M;

    # API Endpoints - Reverse Proxy to FastAPI
    # NOTE: No trailing slash after http://fastapi_backend to preserve /api/v1/... path
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Disable buffer for SSE / streaming audio
        proxy_buffering off;
    }

    # Static Media Storage (TTS Audio, POI Images)
    location /storage/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Tourist Web Client Portal
    location /client/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CMS Portal
    location /admin/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI Docs
    location /docs {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }

    # Root fallback
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

