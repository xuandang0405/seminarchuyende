map $http_x_forwarded_proto $tourvoice_proto {
    default $scheme;
    https https;
}

map $http_x_forwarded_for $tourvoice_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

server {
    listen 80;
    client_max_body_size 50M;
    # Docker DNS resolves the replacement API container after an upgrade.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $tourvoice_api backend:8000;
        proxy_pass http://$tourvoice_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $tourvoice_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tourvoice_proto;
        proxy_read_timeout 90s;
    }
}
