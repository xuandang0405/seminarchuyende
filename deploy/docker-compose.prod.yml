services:
  mongodb:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes: ["mongo_data_prod:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { if (e.codeName !== \"NotYetInitialized\") throw e; rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}); } if (!db.hello().isWritablePrimary) quit(1)'"]
      interval: 10s
      timeout: 10s
      retries: 10
  backend:
    image: ${TOURVOICE_IMAGE:-tourvoice:local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ["${TOURVOICE_ENV_FILE:-./env/.env.production}"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/tour_guide?replicaSet=rs0
      MEDIA_STORAGE_DIR: /app/backend/storage
      FORWARDED_ALLOW_IPS: "*"
    volumes: ["media_storage_prod:/app/backend/storage"]
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    image: ${TOURVOICE_IMAGE:-tourvoice:local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file: ["${TOURVOICE_ENV_FILE:-./env/.env.production}"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/tour_guide?replicaSet=rs0
      MEDIA_STORAGE_DIR: /app/backend/storage
    volumes: ["media_storage_prod:/app/backend/storage"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck: {disable: true}
  reverse-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${TOURVOICE_PORT:-8080}:80"]
    volumes: ["./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 4s
      retries: 6
volumes:
  mongo_data_prod:
  media_storage_prod:
