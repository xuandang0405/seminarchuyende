version: '3.8'

# ==============================================================================
# Production Docker Compose Architecture for TourVoice Quận 4
# Secure Same-Origin Topology:
# - Nginx is the only service exposed to the Public Internet (Ports 80 & 443).
# - FastAPI, MongoDB, and Redis communicate entirely within private network.
# ==============================================================================

networks:
  tourvoice_internal:
    driver: bridge

volumes:
  mongo_data_prod:
  redis_data_prod:
  media_storage_prod:

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database (Private Internal Network Only)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: tourvoice_prod_mongodb
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    networks:
      - tourvoice_internal
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Job Broker (Private Internal Network Only)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: tourvoice_prod_redis
    restart: always
    networks:
      - tourvoice_internal
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. FastAPI Backend (Private Internal Network Only)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tourvoice_prod_backend
    restart: always
    environment:
      - APP_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/tourvoice_district4?replicaSet=rs0
      - MONGODB_DB_NAME=tourvoice_district4
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_WEB_URL=http://1.55.58.251
      - CORS_ALLOWED_ORIGINS=http://1.55.58.251,https://tour.quan4.vn
      - FORWARDED_ALLOW_IPS=*
      - STORAGE_DIR=/app/storage
    volumes:
      - media_storage_prod:/app/storage
    networks:
      - tourvoice_internal
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy (Public Entrypoint: Ports 80 & 443)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: tourvoice_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tour-guide.conf:/etc/nginx/conf.d/default.conf:ro
      - media_storage_prod:/var/www/storage:ro
    networks:
      - tourvoice_internal
    depends_on:
      - backend
